apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kitchen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/jucollet/kitchen-api:516cfec4cb0fb53b191df0ff10842acb48e53add
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: kitchen-api
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://kitchen-db-rw:5432/kitchen
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kitchen-db-app
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kitchen-db-app
                  key: password
            - name: KITCHEN_PUBLIC_URL
              value: https://kitchen.julco.dev
            - name: KITCHEN_GOTENBERG_URL
              value: http://gotenberg:3000
            - name: KITCHEN_MCP_ALLOWED_ORIGINS
              value: https://claude.ai
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: kitchen
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: http
