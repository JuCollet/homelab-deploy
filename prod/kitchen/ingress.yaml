apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kitchen
  namespace: kitchen
spec:
  ingressClassName: traefik
  rules:
    - host: kitchen.julco.dev
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /login
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /logout
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /webauthn
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /exports
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /actuator/health
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
