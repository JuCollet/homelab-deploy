apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: kitchen-b2
  namespace: kitchen
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://kitchen-db/
    endpointURL: https://s3.eu-central-003.backblazeb2.com
    s3Credentials:
      accessKeyId:
        name: b2-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: b2-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
