apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg
  namespace: kitchen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gotenberg
  template:
    metadata:
      labels:
        app: gotenberg
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gotenberg
          image: gotenberg/gotenberg:8.39.0
          args:
            - --chromium-allow-list=^file:///tmp/.*
            - --chromium-deny-public-ips
            - --chromium-deny-private-ips
            - --chromium-disable-javascript
            - --api-disable-download-from
            - --webhook-disable
            - --libreoffice-disable-routes
            - --pdfengines-disable-routes
            - --prometheus-disable-collect
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gotenberg
  namespace: kitchen
spec:
  selector:
    app: gotenberg
  ports:
    - name: http
      port: 3000
      targetPort: http
