apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: kitchen-db-daily
  namespace: kitchen
spec:
  schedule: "0 0 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: kitchen-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
