apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kitchen
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JuCollet/homelab-deploy.git
    targetRevision: main
    path: prod/kitchen
  destination:
    server: https://kubernetes.default.svc
    namespace: kitchen
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
